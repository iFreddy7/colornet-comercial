# Funções chamadas pelo portal usam JWT. Integrações máquina-a-máquina
# mantêm verify_jwt=false e validam segredo próprio no corpo da função.
[functions.admin-criar-usuario]
verify_jwt = true

[functions.cotacao-confirmacao]
verify_jwt = true

[functions.ptax-atualizar]
verify_jwt = true

[functions.swift-function]
verify_jwt = true

[functions.pedido-confirmacao]
verify_jwt = false

[functions.ingest-email-xlsx]
verify_jwt = false
