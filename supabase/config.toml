# Funções chamadas pelo portal usam JWT. Integrações máquina-a-máquina
# mantêm verify_jwt=false e validam segredo próprio no corpo da função.
[functions.admin-criar-usuario]
verify_jwt = true

[functions.admin-gerar-link-senha]
verify_jwt = true

[functions.cotacao-confirmacao]
verify_jwt = true

[functions.ptax-atualizar]
# Valida JWT do usuário ativo ou x-ptax-secret pelo RPC restrito a service_role.
verify_jwt = false

[functions.swift-function]
verify_jwt = true

[functions.pedido-confirmacao]
verify_jwt = false

[functions.ingest-email-xlsx]
verify_jwt = false

# auth.getUser + perfil ativo são verificados no corpo em todo envio.
# O diagnóstico SMTP aceita exclusivamente a secret key do próprio projeto.
[functions.cotacao-decisao-email]
verify_jwt = false
